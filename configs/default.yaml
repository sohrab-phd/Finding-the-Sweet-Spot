# Global reproduction settings for "Finding the Sweet Spot"
seed: 42
project_root: .
data_raw: data/raw
data_processed: data/processed
results_dir: results

# SemEval-2010 Task 8
num_relations: 19
train_size: 8000
test_size: 2717

# Algorithm 1 subset fractions (Table I)
subset_fractions:
  SE.1: 0.0078125   # 1/128 → 62
  SE.2: 0.015625    # 1/64  → 125
  SE.3: 0.03125     # 1/32  → 250
  SE.4: 0.0625      # 1/16  → 500
  SE.5: 0.125       # 1/8   → 1000
  SE.6: 0.25        # 1/4   → 2000
  SE.7: 0.5         # 1/2   → 4000
  SE.8: 1.0         # 1     → 8000

# Expected instance counts from Table I
subset_sizes:
  SE.1: 62
  SE.2: 125
  SE.3: 250
  SE.4: 500
  SE.5: 1000
  SE.6: 2000
  SE.7: 4000
  SE.8: 8000

# Evaluation
metrics:
  - accuracy
  - precision
  - recall
  - f1
average: macro

# Diminishing-returns threshold shown in Figures 1–2
threshold_fraction: 0.5

# Device: auto picks CUDA when a CUDA-enabled PyTorch build is installed
device: cuda  # cuda | auto | cpu

