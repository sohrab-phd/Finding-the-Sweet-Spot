# MTB / BERT-EM supervised fine-tuning (Soares et al., ACL 2019)
# Full MTB Wikipedia pretraining is not included; this config fine-tunes BERT EM.
model_name: mtb
pretrained_model: bert-base-uncased
max_seq_len: 128
dropout: 0.1
learning_rate: 3.0e-5
optimizer: adamw
weight_decay: 0.01
batch_size: 16
epochs: 5
grad_clip: 1.0
warmup_ratio: 0.1
# Entity marker tokens (Soares et al. ENTITY START / ENTITY END style)
entity_marker_e1_start: "[E1]"
entity_marker_e1_end: "[/E1]"
entity_marker_e2_start: "[E2]"
entity_marker_e2_end: "[/E2]"
# Relation representation: concatenate entity-start hidden states
representation: entity_start
